name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve build version
        id: version
        run: |
          VERSION="$(python3 scripts/create_release_snapshot.py --print-version)"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release snapshot manifest
        run: |
          mkdir -p _site/revisions
          python3 scripts/create_release_snapshot.py \
            --site-root . \
            --output-dir _site/revisions \
            --git-sha "$GITHUB_SHA"
      - name: Collect static files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp CNAME _site/
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          [ -f robots.txt ] && cp robots.txt _site/ || true
          [ -d docs ] && cp -r docs _site/docs || true
          cp _site/revisions/latest.json _site/revision-snapshot.json
      - name: Package deployed site snapshot
        run: |
          mkdir -p _snapshots/site
          cp index.html _snapshots/site/
          [ -f CNAME ] && cp CNAME _snapshots/site/ || true
          [ -f sitemap.xml ] && cp sitemap.xml _snapshots/site/ || true
          [ -f robots.txt ] && cp robots.txt _snapshots/site/ || true
          cp _site/revisions/${{ steps.version.outputs.value }}.json _snapshots/
          tar -czf _snapshots/slob-games-${{ steps.version.outputs.value }}.tar.gz -C _snapshots/site .
      - name: Upload release snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-snapshot-${{ steps.version.outputs.value }}
          path: _snapshots
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
