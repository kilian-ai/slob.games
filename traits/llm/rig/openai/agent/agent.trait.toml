[trait]
description = "Rig-backed OpenAI agent shim for WASM: builds a real rig-core agent, then executes via existing sync transport"
version = "v260415"
author = "system"
tags = ["llm", "rig", "openai", "agent", "wasm"]

[signature]
params = [
  { name = "prompt", type = "string", description = "User message to send to the agent", required = true },
  { name = "model", type = "string", description = "OpenAI model name (default: gpt-4o-mini)", required = false, default = "gpt-4o-mini" },
  { name = "preamble", type = "string", description = "Rig agent system preamble", required = false },
  { name = "context", type = "string", description = "Comma-separated VFS paths or globs to inject as Rig context docs", required = false },
  { name = "temperature", type = "float", description = "Optional Rig agent temperature", required = false }
]

[signature.returns]
type = "map"
description = "Result map with provider/model/content metadata"

[implementation]
language = "rust"
source = "builtin"
entry = "rig_openai_agent"
wasm = true